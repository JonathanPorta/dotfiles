# Managed by dotfiles: edit dotfiles/.tmux.conf, not ~/.tmux.conf.

# Let tmux copy to the system clipboard (OSC 52) when the terminal allows it.
set -g set-clipboard on

# prefix + Y: copy the pane's whole scrollback to the clipboard.
bind Y run-shell "tmux capture-pane -p -S - -t '#{pane_id}' | tmux load-buffer -w -" \; display-message "Copied scrollback to clipboard"
